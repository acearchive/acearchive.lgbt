{{- if .Params.to_year -}}
  {{- if eq .Params.from_year .Params.to_year -}}
    <time datetime="{{ .Params.from_year }}">{{ .Params.from_year }}</time>
  {{- else -}}
    <time datetime="{{ .Params.from_year }}">{{ .Params.from_year }}</time>-<time datetime="{{ .Params.to_year }}">{{ .Params.to_year }}</time>
  {{- end -}}
{{- else -}}
  <time datetime="{{ .Params.from_year }}">{{ .Params.from_year }}</time>
{{- end -}}
