# General
baseurl: "https://acearchive.lgbt/"
relativeUrls: true
canonifyURLs: false
disableAliases: true
disableHugoGeneratorInject: false
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
languageCode: "en-US"
disableKinds: ["RSS"]

pagination:
  pagerSize: 20

outputs:
  home: ["HTML", "REDIRECTS"]
  section: ["HTML", "SITEMAP"]

# Generate higher quality WebP images than the default.
imaging:
  quality: 100

# Don't generate the `_headers` and `_redirects` files with a file extension.
mediaTypes:
  text/netlify:
    suffixes: [""]
    delimiter: ""
  application/ld+json:
    suffixes: ["jsonld"]
    delimiter: "."

outputFormats:
  # Add an output format for the JSON-LD documents served by the Omeka Data
  # Connector. Pages link to these as an alternate representation, and the
  # worker serves them via content negotiation.
  JSONLD:
    mediaType: "application/ld+json"
    baseName: "index"
    isPlainText: true
    rel: "alternate"

  # Add an output format for the `redirects.json` file.
  REDIRECTS:
    mediaType: "application/json"
    baseName: "redirects"
    isPlainText: true
    notAlternative: true

  # Add output format for the section `sitemap.xml`.
  SITEMAP:
    mediaType: "application/xml"
    baseName: "sitemap"
    isHTML: false
    isPlainText: true
    noUgly: true
    rel: "sitemap"

# Trust the `Content-Type` of remote JSON-LD documents. Without this, defining
# the `application/ld+json` media type above causes `resources.GetRemote` to
# fail to resolve their media type.
security:
  http:
    mediaTypes: ["^application/ld\\+json$"]

caches:
  getjson:
    maxAge: "90s"
  getresource:
    maxAge: "90s"

sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.5

taxonomies:
  person: "people"
  identity: "identities"
  decade: "decades"
  collection: "collections"

# Generate JSON-LD documents for the taxonomy terms the Omeka Data Connector
# has documents for. There are none for decades.
cascade:
  - target:
      kind: "term"
      path: "{/people/**,/identities/**,/collections/**}"
    outputs: ["HTML", "JSONLD"]

permalinks:
  people: "/people/:title/"
  identities: "/identities/:title/"
  decades: "/decades/:title/"
  collections: "/collections/:title/"

minify:
  # Settings for the HTML minifier.
  tdewolff:
    html:
      keepWhitespace: true
