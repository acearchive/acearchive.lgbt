hugoVersion:
  extended: true
  min: "0.100.0"

mounts:
  - source: "node_modules/@github/clipboard-copy-element"
    target: "assets/js/vendor/clipboard-copy-element"
  - source: "node_modules/bootstrap"
    target: "assets/js/vendor/bootstrap"
  - source: "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js.map"
    target: "static/js/vendor/bootstrap/dist/js/bootstrap.bundle.min.js.map"
  - source: "node_modules/@stoplight/elements"
    target: "assets/js/vendor/stoplight"
  - source: "../node_modules/@fontsource/fira-sans/files"
    target: "static/fonts/fira-sans"
    includeFiles:
      - "fira-sans-latin-400-*.woff2"
      - "fira-sans-latin-ext-400-*.woff2"
      - "fira-sans-latin-500-*.woff2"
      - "fira-sans-latin-ext-500-*.woff2"
      - "fira-sans-latin-700-*.woff2"
      - "fira-sans-latin-ext-700-*.woff2"
  - source: "assets"
    target: "assets"
  - source: "assets/scss"
    target: "assets/scss"
  - source: "static"
    target: "static"
  - source: "layouts"
    target: "layouts"
  - source: "archetypes"
    target: "archetypes"
  - source: "data"
    target: "data"
