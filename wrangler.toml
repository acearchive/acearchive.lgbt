name = "acearchive-site"
account_id = "dd48e1a60e3648ec3f391663eadf89b8"
compatibility_date = "2025-05-07"
preview_urls = false
main = "./worker/index.ts"

[assets]
directory = "./site/public/"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[observability]
enabled = true

[env.dev]

[env.dev.route]
pattern = "dev.acearchive.lgbt"
custom_domain = true

[[env.dev.r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "acearchive-data-exports"

[env.prod]

[env.prod.route]
pattern = "acearchive.lgbt"
custom_domain = true

[[env.prod.r2_buckets]]
binding = "EXPORTS_BUCKET"
bucket_name = "acearchive-data-exports"
